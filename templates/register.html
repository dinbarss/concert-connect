{% extends "layout.html" %}

{% block title %}Rekisteröinti{% endblock %}

{% block content %}

  <h1>Rekisteröidy</h1>

  {% if error %}
  <p style="color: red;">{{ error }}</p>
  {% endif %}

  <form action="/create" method="post">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <p>
      <label for="username">Tunnus:</label><br />
      <input type="text" name="username" id="username" required />
    </p>
    <p>
      <label for="password1">Salasana:</label><br />
      <input type="password" name="password1" id="password1" required />
    </p>
    <p>
      <label for="password2">Salasana uudestaan:</label><br />
      <input type="password" name="password2" id="password2" required />
    </p>
    <input type="submit" value="Luo tunnus" />
    <p>
      Onko sinulla jo tunnus? <a href="/login">Kirjaudu sisään</a>
    </p>
  </form>

{% endblock %}
